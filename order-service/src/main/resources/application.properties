spring.application.name=order-service

server.port=8085

spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/orderdb}
spring.datasource.username=${ORDER_DB_USERNAME}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema. Hibernate's ddl-auto is validate-only (see below) so
# entity/schema drift fails fast at startup instead of being silently patched.
# baseline-on-migrate stamps pre-Flyway databases (created by the old ddl-auto=update)
# at V1 and skips it, so existing and fresh databases converge from V2 onward.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.hibernate.ddl-auto=${ORDER_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${ORDER_JPA_SHOW_SQL:false}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Azure Cache for Redis disables the plaintext port; it needs true on port 6380.
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
order.idempotency.ttl-seconds=${ORDER_IDEMPOTENCY_TTL_SECONDS:86400}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# SASL settings are ignored unless KAFKA_SECURITY_PROTOCOL is SASL_PLAINTEXT or SASL_SSL.
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
orders.kafka.topic=${ORDER_EVENTS_TOPIC:order-events}
users.kafka.topic=${USER_EVENTS_TOPIC:user-events}
# Its own group, deliberately not notification-service's: two services sharing a group id
# would each receive only a share of the partitions instead of the whole stream.
spring.kafka.consumer.group-id=${ORDER_CONSUMER_GROUP:order-service-user-projection}
spring.kafka.consumer.auto-offset-reset=earliest
outbox.publisher.delay-ms=${OUTBOX_PUBLISHER_DELAY_MS:5000}
outbox.retention-days=${OUTBOX_RETENTION_DAYS:7}

services.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8083}
services.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8084}
services.payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8087}
payments.currency=${PAYMENT_CURRENCY:USD}
# order-service's own identity for calls to inventory and payment: the OAuth2
# client-credentials grant against auth-service's token endpoint. See FeignConfig.
spring.security.oauth2.client.registration.mobi-services.client-id=order-service
spring.security.oauth2.client.registration.mobi-services.client-secret=${ORDER_SERVICE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.mobi-services.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.mobi-services.client-authentication-method=client_secret_basic
spring.security.oauth2.client.provider.mobi-services.token-uri=${AUTH_TOKEN_URI:http://localhost:8082/oauth2/token}
# Access tokens are RS256-signed by auth-service. Spring Security verifies the signature
# with the public keys at the JWKS URL (fetched lazily, cached, refetched on an unknown
# kid), then checks expiry, issuer and audience. The role claim becomes the authority
# as-is (ADMIN, USER, SERVICE). Pointing these at Keycloak or Okta needs no code change.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:http://localhost:8082}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8082/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=mobi-api
spring.security.oauth2.resourceserver.jwt.authorities-claim-name=role
spring.security.oauth2.resourceserver.jwt.authority-prefix=
spring.cloud.openfeign.client.config.default.connect-timeout=${FEIGN_CONNECT_TIMEOUT_MS:2000}
spring.cloud.openfeign.client.config.default.read-timeout=${FEIGN_READ_TIMEOUT_MS:5000}
feign.retry.period-ms=${FEIGN_RETRY_PERIOD_MS:100}
feign.retry.max-period-ms=${FEIGN_RETRY_MAX_PERIOD_MS:500}
feign.retry.max-attempts=${FEIGN_RETRY_MAX_ATTEMPTS:3}
# Per-target timeouts. The payment provider is the slowest hop in checkout, so it
# gets more room than the in-cluster services, but still finite.
spring.cloud.openfeign.client.config.paymentClient.read-timeout=${PAYMENT_READ_TIMEOUT_MS:10000}

# Circuit breakers (see ResilienceConfig): opens when half of the last 20 calls to a
# dependency failed or ran slower than 3s, then probes again after 15s.
resilience.circuit-breaker.failure-rate-threshold=${CB_FAILURE_RATE_THRESHOLD:50}
resilience.circuit-breaker.slow-call-threshold-ms=${CB_SLOW_CALL_THRESHOLD_MS:3000}
resilience.circuit-breaker.sliding-window-size=${CB_SLIDING_WINDOW_SIZE:20}
resilience.circuit-breaker.minimum-calls=${CB_MINIMUM_CALLS:10}
resilience.circuit-breaker.open-state-wait-ms=${CB_OPEN_STATE_WAIT_MS:15000}

# Kafka consumer retries before a record goes to <topic>.DLT (see KafkaConsumerConfig).
kafka.retry.initial-interval-ms=${KAFKA_RETRY_INITIAL_INTERVAL_MS:1000}
kafka.retry.max-elapsed-ms=${KAFKA_RETRY_MAX_ELAPSED_MS:30000}


# prometheus is what makes this observable; metrics is the human-readable view of
# the same registry. Still no env, beans, configprops, or heapdump — those leak
# configuration and are not safe on an endpoint reachable through the gateway.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Tag every series with its source so one Prometheus can scrape all six services
# and queries can still separate them.
management.metrics.tags.application=${spring.application.name}
# Latency histograms, not just counts — p95/p99 are what page you, and averages hide them.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s

# Surface the correlation ID that CorrelationIdFilter puts in the MDC. Without this
# the ID is computed, propagated across services, and then never printed — Spring's
# default console pattern does not include MDC values.
logging.pattern.level=%5p [${spring.application.name:-},%X{correlationId:-}]
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Distributed tracing ---------------------------------------------------------
# Micrometer Tracing over OpenTelemetry. Every inbound request, Feign call, Kafka send
# and Kafka receive becomes a span, and the W3C traceparent header carries the trace
# from service to service, so one checkout can be followed end to end in Jaeger.
# 100% sampling suits a demo; production would lower it (0.1 is Boot's default).
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.otlp.enabled=${TRACING_EXPORT_ENABLED:true}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
# The OpenTelemetry starter also brings OTLP metrics and log export. Metrics are already
# scraped by Prometheus and logs go to stdout, so both stay off to avoid a second pipeline.
management.otlp.metrics.export.enabled=false
management.logging.export.otlp.enabled=false
