services:
  mysql:
    image: mysql:8.4
    container_name: scalablerest-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      AUTH_DB_NAME: ${AUTH_DB_NAME:-authdb}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      PRODUCT_DB_NAME: ${PRODUCT_DB_NAME:-productdb}
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME:-product_user}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventorydb}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-inventory_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orderdb}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:-order_user}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api-gateway:
    build:
      context: ./api-gateway
    image: scalablerest/api-gateway:local
    container_name: scalablerest-api-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8082
      PRODUCT_SERVICE_URL: http://product-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: scalablerest-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  auth-service:
    build:
      context: ./auth-service
    image: scalablerest/auth-service:local
    container_name: scalablerest-auth-service
    ports:
      - "8082:8082"
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql:3306/${AUTH_DB_NAME:-authdb}
      AUTH_DB_USERNAME: ${AUTH_DB_USERNAME:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      AUTH_JPA_DDL_AUTO: update
      AUTH_JPA_SHOW_SQL: ${AUTH_JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  product-service:
    build:
      context: ./product-service
    image: scalablerest/product-service:local
    container_name: scalablerest-product-service
    ports:
      - "8083:8083"
    environment:
      PRODUCT_DB_URL: jdbc:mysql://mysql:3306/${PRODUCT_DB_NAME:-productdb}
      PRODUCT_DB_USERNAME: ${PRODUCT_DB_USERNAME:-product_user}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
      PRODUCT_JPA_DDL_AUTO: update
      PRODUCT_JPA_SHOW_SQL: ${PRODUCT_JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  inventory-service:
    build:
      context: ./inventory-service
    image: scalablerest/inventory-service:local
    container_name: scalablerest-inventory-service
    ports:
      - "8084:8084"
    environment:
      INVENTORY_DB_URL: jdbc:mysql://mysql:3306/${INVENTORY_DB_NAME:-inventorydb}
      INVENTORY_DB_USERNAME: ${INVENTORY_DB_USERNAME:-inventory_user}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      INVENTORY_JPA_DDL_AUTO: update
      INVENTORY_JPA_SHOW_SQL: ${INVENTORY_JPA_SHOW_SQL:-false}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  order-service:
    build:
      context: ./order-service
    image: scalablerest/order-service:local
    container_name: scalablerest-order-service
    ports:
      - "8085:8085"
    environment:
      ORDER_DB_URL: jdbc:mysql://mysql:3306/${ORDER_DB_NAME:-orderdb}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:-order_user}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_JPA_DDL_AUTO: update
      ORDER_JPA_SHOW_SQL: ${ORDER_JPA_SHOW_SQL:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ORDER_IDEMPOTENCY_TTL_SECONDS: ${ORDER_IDEMPOTENCY_TTL_SECONDS:-86400}
      PRODUCT_SERVICE_URL: http://product-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    depends_on:
      mysql:
        condition: service_healthy
      product-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql-data:
