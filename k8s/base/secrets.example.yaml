apiVersion: v1
kind: Secret
metadata:
  name: mobi-secrets
  namespace: mobi
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-with-local-mysql-root-password

  AUTH_DB_PASSWORD: replace-with-local-auth-db-password
  PRODUCT_DB_PASSWORD: replace-with-local-product-db-password
  INVENTORY_DB_PASSWORD: replace-with-local-inventory-db-password
  ORDER_DB_PASSWORD: replace-with-local-order-db-password
  PAYMENT_DB_PASSWORD: replace-with-local-payment-db-password
  PROCUREMENT_DB_PASSWORD: replace-with-local-procurement-db-password
  NOTIFICATION_DB_PASSWORD: replace-with-local-notification-db-password

  ADMIN_BOOTSTRAP_USERNAME: admin
  ADMIN_BOOTSTRAP_PASSWORD: replace-with-local-admin-password
  WAREHOUSE_BOOTSTRAP_USERNAME: warehouse
  WAREHOUSE_BOOTSTRAP_PASSWORD: replace-with-local-warehouse-password
  SUPPLIER_BOOTSTRAP_USERNAME: supplier
  SUPPLIER_BOOTSTRAP_PASSWORD: replace-with-local-supplier-password

  # Optional providers. Leave unset to use the simulated card network, Mailpit and
  # logged SMS.
  # STRIPE_SECRET_KEY: sk_test_...
  # MAIL_USERNAME: ses-smtp-username
  # MAIL_PASSWORD: ses-smtp-password
  # TWILIO_ACCOUNT_SID: AC...
  # TWILIO_AUTH_TOKEN: ...
  # TWILIO_FROM_NUMBER: "+15005550006"
---
# Mounted key by key, never with envFrom: only auth-service gets the signing key, and
# only auth-service and order-service get order-service's client secret.
apiVersion: v1
kind: Secret
metadata:
  name: mobi-auth-secrets
  namespace: mobi
type: Opaque
stringData:
  # openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl pkcs8 -topk8 -nocrypt
  JWT_PRIVATE_KEY: |
    -----BEGIN PRIVATE KEY-----
    replace-with-a-real-key
    -----END PRIVATE KEY-----
  ORDER_SERVICE_CLIENT_SECRET: replace-with-openssl-rand-hex-24
  # During a rotation only: the previous key's public half (X.509 PEM).
  # JWT_PREVIOUS_PUBLIC_KEY: |
  #   -----BEGIN PUBLIC KEY-----
  #   ...
