apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: scalablerest
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: scalablerest
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-service
        app.kubernetes.io/part-of: scalablerest
    spec:
      containers:
        - name: product-service
          image: scalablerest/product-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: scalablerest-config
            - secretRef:
                name: scalablerest-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 3
