kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: mobi
nodes:
  - role: control-plane
    # Host ports 80/443 land on NodePorts 30080/30443, which the chart's EnvoyProxy pins
    # the Envoy Gateway Service to in values-local.yaml. kind has no LoadBalancer, so
    # this is how http://localhost reaches the cluster.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
