# Jaeger v2 all-in-one: an OTLP endpoint for the services' spans plus the trace UI,
# with in-memory storage. Local only. On a cloud, send OTLP to a managed backend
# (AWS X-Ray via ADOT, Google Cloud Trace, Azure Monitor, Grafana Tempo) by changing
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT; nothing in the services changes.
#
#   kubectl -n mobi port-forward svc/jaeger 16686:16686   →  http://localhost:16686
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: mobi
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0
          env:
            # The bundled config binds every receiver to localhost by default, which
            # inside a pod means nothing else can reach it.
            - name: JAEGER_LISTEN_HOST
              value: 0.0.0.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /status
              port: 13133
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: mobi
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
