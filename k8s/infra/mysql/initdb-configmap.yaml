apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: mobi
data:
  01-create-service-databases.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    mysql --protocol=socket -uroot -p"$MYSQL_ROOT_PASSWORD" <<-EOSQL
    CREATE DATABASE IF NOT EXISTS \`${AUTH_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${PRODUCT_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${INVENTORY_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${ORDER_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${PAYMENT_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${PROCUREMENT_DB_NAME}\`;
    CREATE DATABASE IF NOT EXISTS \`${NOTIFICATION_DB_NAME}\`;

    CREATE USER IF NOT EXISTS '${AUTH_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${AUTH_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${PRODUCT_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${PRODUCT_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${INVENTORY_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${INVENTORY_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${ORDER_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${ORDER_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${PAYMENT_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${PAYMENT_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${PROCUREMENT_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${PROCUREMENT_DB_PASSWORD}';
    CREATE USER IF NOT EXISTS '${NOTIFICATION_DB_USERNAME}'@'%' IDENTIFIED WITH caching_sha2_password BY '${NOTIFICATION_DB_PASSWORD}';

    GRANT ALL PRIVILEGES ON \`${AUTH_DB_NAME}\`.* TO '${AUTH_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${PRODUCT_DB_NAME}\`.* TO '${PRODUCT_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${INVENTORY_DB_NAME}\`.* TO '${INVENTORY_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${ORDER_DB_NAME}\`.* TO '${ORDER_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${PAYMENT_DB_NAME}\`.* TO '${PAYMENT_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${PROCUREMENT_DB_NAME}\`.* TO '${PROCUREMENT_DB_USERNAME}'@'%';
    GRANT ALL PRIVILEGES ON \`${NOTIFICATION_DB_NAME}\`.* TO '${NOTIFICATION_DB_USERNAME}'@'%';

    FLUSH PRIVILEGES;
    EOSQL

