# Local MySQL for the kind cluster: the official image, pinned to the 8.4 LTS line, the
# same major version as RDS (infra/terraform/modules/aws/rds) and the db-bootstrap job.
#
# Replaces the Bitnami chart, whose images moved to the frozen `bitnamilegacy` repository
# and no longer get security fixes. Init scripts in /docker-entrypoint-initdb.d run on the
# first start of an empty volume; scripts/deploy.sh also re-runs the database script on
# every deploy, since it is idempotent, so databases added later still appear.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: mobi
  labels:
    app.kubernetes.io/name: mysql
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mobi
  labels:
    app.kubernetes.io/name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.13
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: AUTH_DB_NAME
              value: authdb
            - name: AUTH_DB_USERNAME
              value: auth_user
            - name: AUTH_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: AUTH_DB_PASSWORD
            - name: PRODUCT_DB_NAME
              value: productdb
            - name: PRODUCT_DB_USERNAME
              value: product_user
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: PRODUCT_DB_PASSWORD
            - name: INVENTORY_DB_NAME
              value: inventorydb
            - name: INVENTORY_DB_USERNAME
              value: inventory_user
            - name: INVENTORY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: INVENTORY_DB_PASSWORD
            - name: ORDER_DB_NAME
              value: orderdb
            - name: ORDER_DB_USERNAME
              value: order_user
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: ORDER_DB_PASSWORD
            - name: PAYMENT_DB_NAME
              value: paymentdb
            - name: PAYMENT_DB_USERNAME
              value: payment_user
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: PROCUREMENT_DB_NAME
              value: procurementdb
            - name: PROCUREMENT_DB_USERNAME
              value: procurement_user
            - name: PROCUREMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: PROCUREMENT_DB_PASSWORD
            - name: NOTIFICATION_DB_NAME
              value: notificationdb
            - name: NOTIFICATION_DB_USERNAME
              value: notification_user
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobi-secrets
                  key: NOTIFICATION_DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          # TCP, not the socket: during first-start initialisation the image runs a
          # temporary server with networking off, so this only passes once the real
          # server (with every init script applied) is up.
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -uroot -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: initdb
          configMap:
            name: mysql-initdb
            # Executable, so the entrypoint runs it in its own shell instead of sourcing
            # it (its `set -euo pipefail` must not leak into the entrypoint).
            defaultMode: 0755
  # Not "data": the Bitnami chart's claim was data-mysql-0, laid out for its own image.
  # A new name gives a clean volume instead of mounting 8.0-era Bitnami files.
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
