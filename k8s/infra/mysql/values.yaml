architecture: standalone

auth:
  database: scalablerest

primary:
  persistence:
    enabled: true
    size: 2Gi
  extraEnvVars:
    - name: AUTH_DB_NAME
      value: authdb
    - name: AUTH_DB_USERNAME
      value: auth_user
    - name: AUTH_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: scalablerest-secrets
          key: AUTH_DB_PASSWORD
    - name: PRODUCT_DB_NAME
      value: productdb
    - name: PRODUCT_DB_USERNAME
      value: product_user
    - name: PRODUCT_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: scalablerest-secrets
          key: PRODUCT_DB_PASSWORD
    - name: INVENTORY_DB_NAME
      value: inventorydb
    - name: INVENTORY_DB_USERNAME
      value: inventory_user
    - name: INVENTORY_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: scalablerest-secrets
          key: INVENTORY_DB_PASSWORD
    - name: ORDER_DB_NAME
      value: orderdb
    - name: ORDER_DB_USERNAME
      value: order_user
    - name: ORDER_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: scalablerest-secrets
          key: ORDER_DB_PASSWORD

initdbScriptsConfigMap: mysql-initdb

