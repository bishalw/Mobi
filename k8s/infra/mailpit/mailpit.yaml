# Mailpit: an SMTP server that delivers nothing and shows every message in a web
# inbox. notification-service sends real email to it locally, so welcome emails,
# receipts and decline notices can be read without an email provider or account.
#
#   kubectl -n mobi port-forward svc/mailpit 8025:8025   →  http://localhost:8025
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: mobi
  labels:
    app.kubernetes.io/name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: mobi
  labels:
    app.kubernetes.io/name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
