<!DOCTYPE html>
<!--/* Shared frame for every Mobi email. Inline styles only: most mail clients strip <style>. */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Mobi</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#18181b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;">
                <tr>
                    <td style="background:#09090b;padding:20px 28px;color:#ffffff;font-size:20px;font-weight:700;letter-spacing:-0.02em;">mobi</td>
                </tr>
                <tr>
                    <td style="padding:28px;font-size:15px;line-height:1.55;">
                        <div th:replace="${content}"></div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px 24px;font-size:12px;color:#71717a;border-top:1px solid #e4e4e7;">
                        You are receiving this because you have an account with Mobi. This is a transactional message about your account or orders.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
