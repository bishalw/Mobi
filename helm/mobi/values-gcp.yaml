# GCP overlay: GKE.
#
# The Envoy Service is a plain LoadBalancer, which GKE turns into a passthrough
# Network Load Balancer that preserves client IPs. That removes the GCE Ingress
# health-check trap this file used to work around with a BackendConfig: Envoy, not
# the cloud load balancer, now decides which api-gateway pods are healthy.
#
# Endpoints and registry come from the generated values.

gateway:
  proxy:
    service:
      annotations: {}
        # Reserve a regional static IP and pin it here so DNS survives a re-create:
        # networking.gke.io/load-balancer-ip-addresses: mobi-edge-ip

  # For HTTPS, as on AWS: hostname plus a TLS Secret from cert-manager.
  # hostname: mobi.example.com
  # tls:
  #   enabled: true
  #   secretName: mobi-tls
