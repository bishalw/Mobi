# Azure overlay: AKS.
#
# Edge: the same Envoy Gateway as every other target, exposed through a standard
# Azure Load Balancer. AKS's own Gateway API option (Application Gateway for
# Containers) would also work, but keeping Envoy means one identical code path from
# kind to every cloud.
#
# The real Azure-specific work here is Kafka. Azure has no managed Kafka: the Event
# Hubs Kafka-compatible endpoint is the usual substitute, and unlike MSK it refuses
# unauthenticated connections. The env's Terraform emits
# kafka_security_protocol = "SASL_SSL", which reaches the pods through the generated
# values; KAFKA_SASL_JAAS_CONFIG carries the Event Hubs connection string, so it must
# live in the Secret, never the ConfigMap.

config:
  # Event Hubs and Confluent Cloud both authenticate with SASL/PLAIN.
  KAFKA_SASL_MECHANISM: PLAIN

gateway:
  proxy:
    service:
      annotations:
        # A stable DNS label on the load balancer's public IP: <label>.<region>.cloudapp.azure.com
        service.beta.kubernetes.io/azure-dns-label-name: mobi-edge
