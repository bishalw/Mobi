# Neutral base. Defaults here target the local kind cluster and must stay free of
# any cloud-specific value, so `helm template` works with no overlay at all.
#
# Values are layered by scripts/deploy.sh, lowest precedence first:
#
#   values.yaml                     this file — structure and local defaults
#   values-local.yaml               kind only: slower probe delays
#   values-cloud.yaml               any managed cloud: hardened settings
#   values-<cloud>.yaml             ingress flavour and cloud CRDs, ~20 lines
#   values-<env>.generated.yaml     endpoints from `terraform output`, gitignored
#
# Endpoints and image registries are never hand-edited. They come from the
# Terraform output contract via scripts/render-values.sh. See docs/PORTABILITY.md.

namespaceOverride: ""

configMap:
  name: mobi-config

secret:
  name: mobi-secrets

image:
  pullPolicy: IfNotPresent
  tag: local

replicaCount: 1

# Sized for the kind cluster; values-cloud.yaml raises these for real nodes.
#
# CPU is requested but never limited. A CPU limit throttles at the CFS quota
# boundary, and on a JVM that surfaces as latency spikes under precisely the load
# that caused the throttling. The request is what the scheduler places against and
# what the HPA measures utilization from, so it does the useful work here.
#
# Memory is both requested and limited. It is incompressible — a container over
# its limit has to be killed, there is no equivalent of throttling — so the limit
# is what stops one leaking service taking its neighbours on the node down with
# it. On the cloud the two are set equal, which is what the JVM heap pin in
# values-cloud.yaml is sized against.
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 1Gi

# Off locally: kind ships no metrics-server, and an HPA with no metrics source
# reports "unknown" forever rather than failing, which reads as a broken cluster.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Off locally: a single-node cluster has no node to drain onto.
podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

config:
  AUTH_SERVICE_URL: http://auth-service:8082
  PRODUCT_SERVICE_URL: http://product-service:8083
  INVENTORY_SERVICE_URL: http://inventory-service:8084
  ORDER_SERVICE_URL: http://order-service:8085

  AUTH_DB_URL: jdbc:mysql://mysql:3306/authdb
  AUTH_DB_USERNAME: auth_user
  AUTH_JPA_DDL_AUTO: validate
  AUTH_JPA_SHOW_SQL: "false"

  PRODUCT_DB_URL: jdbc:mysql://mysql:3306/productdb
  PRODUCT_DB_USERNAME: product_user
  PRODUCT_JPA_DDL_AUTO: validate
  PRODUCT_JPA_SHOW_SQL: "false"

  INVENTORY_DB_URL: jdbc:mysql://mysql:3306/inventorydb
  INVENTORY_DB_USERNAME: inventory_user
  INVENTORY_JPA_DDL_AUTO: validate
  INVENTORY_JPA_SHOW_SQL: "false"

  ORDER_DB_URL: jdbc:mysql://mysql:3306/orderdb
  ORDER_DB_USERNAME: order_user
  ORDER_JPA_DDL_AUTO: validate
  ORDER_JPA_SHOW_SQL: "false"

  REDIS_HOST: redis-master
  REDIS_PORT: "6379"
  REDIS_SSL_ENABLED: "false"
  ORDER_IDEMPOTENCY_TTL_SECONDS: "86400"

  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # PLAINTEXT locally and on MSK. Managed Kafka that requires auth (Azure Event
  # Hubs, Confluent Cloud) sets SASL_SSL here via the generated values, and must
  # also supply KAFKA_SASL_JAAS_CONFIG through the Secret — it carries a credential.
  KAFKA_SECURITY_PROTOCOL: PLAINTEXT
  KAFKA_SASL_MECHANISM: PLAIN
  ORDER_EVENTS_TOPIC: order-events
  USER_EVENTS_TOPIC: user-events
  NOTIFICATION_CONSUMER_GROUP: notification-service

  JWT_EXPIRATION_MS: "3600000"
  ADMIN_BOOTSTRAP_ENABLED: "true"

services:
  api-gateway:
    image: mobi/api-gateway
    port: 8080
    secretEnv: false
    readinessInitialDelaySeconds: 20
    livenessInitialDelaySeconds: 60
  auth-service:
    image: mobi/auth-service
    port: 8082
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  product-service:
    image: mobi/product-service
    port: 8083
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  inventory-service:
    image: mobi/inventory-service
    port: 8084
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  order-service:
    image: mobi/order-service
    port: 8085
    secretEnv: true
    readinessInitialDelaySeconds: 40
    livenessInitialDelaySeconds: 120
  notification-service:
    image: mobi/notification-service
    port: 8086
    secretEnv: false
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90

# Routes are application facts, not cloud facts — they are defined once, here.
# Overlays override className and annotations only, never the path list.
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        # Scoped to /actuator/health, not all of /actuator. The gateway is the only
        # service reachable from outside the cluster, and actuator now also serves
        # /actuator/prometheus and /actuator/metrics — request patterns, JVM internals,
        # and the full endpoint inventory. Those must stay in-cluster; Prometheus
        # scrapes pods directly. This still covers /health/readiness and /health/liveness.
        - path: /actuator/health
          service: api-gateway
          port: 8080
        - path: /auth
          service: api-gateway
          port: 8080
        - path: /productapi
          service: api-gateway
          port: 8080
        - path: /inventoryapi
          service: api-gateway
          port: 8080
        - path: /orderapi
          service: api-gateway
          port: 8080

# Creates the four per-service databases and their users on a managed instance.
#
# Off locally: the in-cluster Bitnami MySQL already does this from
# k8s/infra/mysql/initdb-configmap.yaml, which runs inside its own bootstrap.
# On by default for cloud environments — see values-cloud.yaml.
#
# This has to run from inside the cluster. A managed instance sits in a private
# subnet reachable only from the node security group, so Terraform running on a
# laptop or in CI cannot connect to issue CREATE DATABASE. Being a Helm hook
# rather than provider-specific Terraform is also what keeps it cloud-neutral:
# the same Job works against RDS, Cloud SQL, and Azure MySQL.
dbBootstrap:
  enabled: false
  image: mysql:8.0
  # From the db_endpoint Terraform output, written by scripts/render-values.sh.
  host: ""
  port: 3306
  backoffLimit: 3
  # prefix resolves both the username, from config.<PREFIX>_DB_USERNAME, and the
  # password, from the <PREFIX>_DB_PASSWORD key in the Secret.
  databases:
    - prefix: AUTH
      name: authdb
    - prefix: PRODUCT
      name: productdb
    - prefix: INVENTORY
      name: inventorydb
    - prefix: ORDER
      name: orderdb

metrics:
  # Annotation-based discovery: works with a stock Prometheus scrape config and needs
  # no CRDs, so it is portable across kind, EKS, GKE, and AKS. If you run the
  # Prometheus Operator, set this false and use a ServiceMonitor via extraManifests.
  podAnnotations: true
  path: /actuator/prometheus

# Extra container env applied to every service, merged with per-service
# services.<name>.extraEnv, which wins. Config that all services read belongs in
# `config` above (it becomes the ConfigMap); this is for per-container settings
# that are not application config — JVM flags being the usual case.
extraEnv: {}

# Raw manifests injected by per-cloud overlays — GKE BackendConfig, managed
# certificates, and the like. Keeps cloud CRDs out of templates/.
extraManifests: []

