# Shared by every managed-cloud environment, on every provider.
#
# This holds the settings that differ between "laptop" and "real infrastructure"
# but NOT between clouds. Keeping them here means a policy change — say, moving
# off Hibernate auto-DDL — is one edit rather than one edit per cloud.
#
# Nothing provider-specific belongs in this file. That goes in values-<cloud>.yaml.

namespaceOverride: mobi

config:
  # ddl-auto is validate in the base values now that Flyway owns the schema on
  # every target, local included, so there is nothing cloud-specific to set here.

  # The bootstrap accounts exist after the first deploy; leaving these on would let
  # a restart silently reset them. The warehouse and supplier logins are demo-only.
  ADMIN_BOOTSTRAP_ENABLED: "false"
  WAREHOUSE_BOOTSTRAP_ENABLED: "false"
  SUPPLIER_BOOTSTRAP_ENABLED: "false"
  # Every request traced is right for a demo; at real traffic one in ten is plenty to
  # find slow paths, and costs a tenth as much in the tracing backend.
  TRACING_SAMPLING_PROBABILITY: "0.1"

# A managed instance provisions one database; the app needs one per service. This creates the
# missing ones and their users before the services start. `host` arrives from the
# db_endpoint Terraform output via the generated values.
dbBootstrap:
  enabled: true

extraEnv:
  # Pin the heap rather than letting the JVM size it from the node. This is the
  # recommendation in k8s/AWS_DEPLOYMENT_NOTES.md; without it a container that
  # gains a memory limit later gets OOMKilled instead of throwing OutOfMemoryError,
  # which is much harder to diagnose from the outside.
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m"

# Two replicas is the floor, not a target: one replica means every rollout and
# every node drain is a gap in service, regardless of what the autoscaler does
# above this number.
replicaCount: 2

# Request equals limit for memory, sized against the pinned heap above. -Xmx512m
# plus metaspace, code cache, thread stacks and direct buffers lands comfortably
# inside 1Gi, and matching the two means the scheduler reserves exactly what the
# container is allowed to use instead of overcommitting the node.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Two Envoy replicas so a node drain or rollout never takes the edge down.
gateway:
  proxy:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
