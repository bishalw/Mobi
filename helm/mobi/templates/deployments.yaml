{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "mobi.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "mobi.labels" $ | nindent 4 }}
spec:
  replicas: {{ default 1 $svc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: mobi
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}:{{ default $.Values.image.tag $svc.tag }}
          imagePullPolicy: {{ default $.Values.image.pullPolicy $svc.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $.Values.configMap.name }}
            {{- if $svc.secretEnv }}
            - secretRef:
                name: {{ $.Values.secret.name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ default 30 $svc.readinessInitialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ default 90 $svc.livenessInitialDelaySeconds }}
            periodSeconds: 20
            timeoutSeconds: 3
---
{{- end }}

