{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "mobi.namespace" $ }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "mobi.labels" $ | nindent 4 }}
spec:
  {{- $auto := merge (dict) (default (dict) $svc.autoscaling) (default (dict) $.Values.autoscaling) }}
  {{- if not $auto.enabled }}
  {{- /* Omitted when an HPA owns this Deployment. Leaving it in makes every
         `helm upgrade` reset the count to the chart's value, silently undoing
         whatever the autoscaler had settled on. */}}
  replicas: {{ default $.Values.replicaCount $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: mobi
      {{- if or $.Values.metrics.podAnnotations $svc.podAnnotations }}
      annotations:
        {{- if $.Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ $.Values.metrics.path | quote }}
        prometheus.io/port: {{ $svc.port | quote }}
        {{- end }}
        {{- with $svc.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}:{{ default $.Values.image.tag $svc.tag }}
          imagePullPolicy: {{ default $.Values.image.pullPolicy $svc.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $.Values.configMap.name }}
            {{- if $svc.secretEnv }}
            - secretRef:
                name: {{ $.Values.secret.name }}
            {{- end }}
          {{- $env := merge (dict) (default (dict) $svc.extraEnv) (default (dict) $.Values.extraEnv) }}
          {{- if or $env $svc.secretKeys }}
          env:
            {{- range $k, $v := $env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $key, $need := $svc.secretKeys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.authSecret.name }}
                  key: {{ $key }}
                  optional: {{ eq $need "optional" }}
            {{- end }}
          {{- end }}
          {{- with default $.Values.resources $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: {{ default 30 $svc.readinessInitialDelaySeconds }}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: {{ default 90 $svc.livenessInitialDelaySeconds }}
            periodSeconds: 20
            timeoutSeconds: 3
---
{{- end }}

