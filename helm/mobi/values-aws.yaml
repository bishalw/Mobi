# AWS overlay — EKS with the AWS Load Balancer Controller.
#
# Ingress flavour only. Image registry, database, Redis, and Kafka endpoints all
# arrive from values-<env>.generated.yaml, rendered from `terraform output`.
# Nothing in this file needs an account ID, a region, or a hostname.

ingress:
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

    # For HTTPS, point at an ACM certificate and swap the listener:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:<region>:<account>:certificate/<id>
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: "443"
