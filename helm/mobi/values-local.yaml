namespaceOverride: mobi

image:
  pullPolicy: IfNotPresent
  tag: local

services:
  auth-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  product-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  inventory-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  order-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  notification-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /actuator
          service: api-gateway
          port: 8080
        - path: /auth
          service: api-gateway
          port: 8080
        - path: /productapi
          service: api-gateway
          port: 8080
        - path: /inventoryapi
          service: api-gateway
          port: 8080
        - path: /orderapi
          service: api-gateway
          port: 8080

