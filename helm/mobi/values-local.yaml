# kind overlay. Ingress is inherited from values.yaml unchanged — the base
# defaults to ingress-nginx, which is what the kind cluster runs.
#
# The only thing local needs is patience: images are built on the host and the
# JVMs start slowly on a laptop with all six services and MySQL, Redis, and Kafka
# competing for the same cores.

namespaceOverride: mobi

image:
  pullPolicy: IfNotPresent
  tag: local

services:
  auth-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  product-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  inventory-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  order-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180
  notification-service:
    readinessInitialDelaySeconds: 160
    livenessInitialDelaySeconds: 180

