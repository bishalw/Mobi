namespaceOverride: ""

configMap:
  name: scalablerest-config

secret:
  name: scalablerest-secrets

image:
  pullPolicy: IfNotPresent
  tag: local

config:
  AUTH_SERVICE_URL: http://auth-service:8082
  PRODUCT_SERVICE_URL: http://product-service:8083
  INVENTORY_SERVICE_URL: http://inventory-service:8084
  ORDER_SERVICE_URL: http://order-service:8085

  AUTH_DB_URL: jdbc:mysql://mysql:3306/authdb
  AUTH_DB_USERNAME: auth_user
  AUTH_JPA_DDL_AUTO: update
  AUTH_JPA_SHOW_SQL: "false"

  PRODUCT_DB_URL: jdbc:mysql://mysql:3306/productdb
  PRODUCT_DB_USERNAME: product_user
  PRODUCT_JPA_DDL_AUTO: update
  PRODUCT_JPA_SHOW_SQL: "false"

  INVENTORY_DB_URL: jdbc:mysql://mysql:3306/inventorydb
  INVENTORY_DB_USERNAME: inventory_user
  INVENTORY_JPA_DDL_AUTO: update
  INVENTORY_JPA_SHOW_SQL: "false"

  ORDER_DB_URL: jdbc:mysql://mysql:3306/orderdb
  ORDER_DB_USERNAME: order_user
  ORDER_JPA_DDL_AUTO: update
  ORDER_JPA_SHOW_SQL: "false"

  REDIS_HOST: redis-master
  REDIS_PORT: "6379"
  ORDER_IDEMPOTENCY_TTL_SECONDS: "86400"

  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  ORDER_EVENTS_TOPIC: order-events
  USER_EVENTS_TOPIC: user-events
  NOTIFICATION_CONSUMER_GROUP: notification-service

  JWT_EXPIRATION_MS: "3600000"
  ADMIN_BOOTSTRAP_ENABLED: "true"

services:
  api-gateway:
    image: scalablerest/api-gateway
    port: 8080
    secretEnv: false
    readinessInitialDelaySeconds: 20
    livenessInitialDelaySeconds: 60
  auth-service:
    image: scalablerest/auth-service
    port: 8082
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  product-service:
    image: scalablerest/product-service
    port: 8083
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  inventory-service:
    image: scalablerest/inventory-service
    port: 8084
    secretEnv: true
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90
  order-service:
    image: scalablerest/order-service
    port: 8085
    secretEnv: true
    readinessInitialDelaySeconds: 40
    livenessInitialDelaySeconds: 120
  notification-service:
    image: scalablerest/notification-service
    port: 8086
    secretEnv: false
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 90

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /actuator
          service: api-gateway
          port: 8080
        - path: /auth
          service: api-gateway
          port: 8080
        - path: /productapi
          service: api-gateway
          port: 8080
        - path: /inventoryapi
          service: api-gateway
          port: 8080
        - path: /orderapi
          service: api-gateway
          port: 8080

