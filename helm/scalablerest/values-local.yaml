namespaceOverride: scalablerest

image:
  pullPolicy: IfNotPresent
  tag: local

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /actuator
          service: api-gateway
          port: 8080
        - path: /auth
          service: api-gateway
          port: 8080
        - path: /productapi
          service: api-gateway
          port: 8080
        - path: /inventoryapi
          service: api-gateway
          port: 8080
        - path: /orderapi
          service: api-gateway
          port: 8080

